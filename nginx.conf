server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Файли з хешем у імені не змінюються ніколи — можна кешувати назавжди.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html не кешуємо, інакше користувач залишиться на старій збірці.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /healthz {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"UP"}';
    }

    # SPA: будь-який шлях віддає index.html, роутинг робить Vue Router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
