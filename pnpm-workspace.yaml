# pnpm не ставить пакети, молодші за minimumReleaseAge, — захист від
# отруєних релізів у чужих залежностях. Власні пакети організації (контракти
# з kite-contracts) з'являються за хвилини до PR, який їх підключає (5.4, п. 6),
# тож для них затримки немає.
minimumReleaseAgeExclude:
  - '@kite-post/*'
