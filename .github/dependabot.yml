version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      vue:
        patterns: ['vue', 'vue-*', '@vue/*', 'pinia']
      tooling:
        patterns: ['vite', 'vitest', 'eslint*', '@vitejs/*', 'typescript', 'prettier']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
